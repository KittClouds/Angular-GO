<div class="h-full w-full flex flex-col relative bg-editor text-editor-foreground">
    <!-- Editor (always rendered, hidden when no note) -->
    <div class="flex-1 overflow-auto scrollbar-thin" [class.hidden]="!noteEditorStore.isNoteOpen()">
        <div #editorContainer class="crepe-host min-h-full w-full">
        </div>
    </div>

    <!-- No Note Selected Placeholder (shown when no note open) -->
    <div *ngIf="!noteEditorStore.isNoteOpen()" class="faeryx-empty absolute inset-0">
        <div class="faeryx-aura" aria-hidden="true"></div>
        <img src="/docs/Fenryx.svg" alt="" class="faeryx-watermark" aria-hidden="true" decoding="async" />
        <section class="faeryx-card" aria-label="No note selected">
            <img src="/docs/Fenryx.svg" alt="Faeryx" class="faeryx-mark" decoding="async" />
            <om-gradient-text text="Faeryx" gradientStart="#27f5ee" gradientEnd="#a855f7"
                styleClass="faeryx-title">
            </om-gradient-text>
            <p class="faeryx-kicker">Narrative machine online</p>
            <h2>No note selected</h2>
            <p class="faeryx-copy">
                Choose a note from the sidebar or open a fresh page for the next signal.
            </p>
            <button type="button" class="faeryx-primary-action" (click)="createNote()">
                <lucide-icon [img]="Plus" size="18"></lucide-icon>
                Create New Note
            </button>
            <div class="faeryx-capabilities" aria-hidden="true">
                <span>OverGraph</span>
                <span>Alex</span>
                <span>Signals</span>
            </div>
        </section>
    </div>
</div>
