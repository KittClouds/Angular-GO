[package]
name = "phoenix-om"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[features]
default = []
legacy-cozo-store = ["dep:phoenix-store-cozo"]
legacy-graptor = ["dep:phoenix-om-graptor", "legacy-cozo-store"]

[dependencies]
phoenix-om-graptor = { path = "../phoenix-om-graptor", optional = true }
phoenix-scanner = { path = "../phoenix-scanner" }
phoenix-store-cozo = { path = "../phoenix-store-cozo", optional = true }
phoenix-store-native = { path = "../phoenix-store-native" }
phoenix-store-native-core = { path = "../phoenix-store-native-core" }
phoenix-structure = { path = "../phoenix-structure" }
phoenix-types = { path = "../phoenix-types" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
openrouter-rs.workspace = true
tokio = { version = "1", features = ["rt", "rt-multi-thread"] }
