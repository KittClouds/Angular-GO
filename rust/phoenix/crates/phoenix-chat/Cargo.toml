[package]
name = "phoenix-chat"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[features]
default = []
legacy-cozo-store = ["dep:phoenix-store-cozo"]

[dependencies]
phoenix-om = { path = "../phoenix-om" }
phoenix-store-cozo = { path = "../phoenix-store-cozo", optional = true }
phoenix-store-native = { path = "../phoenix-store-native" }
phoenix-store-native-core = { path = "../phoenix-store-native-core" }
phoenix-types = { path = "../phoenix-types" }
serde.workspace = true
serde_json.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
anyhow = "1"
openrouter-rs.workspace = true
