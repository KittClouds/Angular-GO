[workspace]
members = [
    "crates/phoenix-alex",
    "crates/phoenix-gldr",
    "crates/phoenix-graptor",
    "crates/phoenix-lex",
    "crates/phoenix-native",
    "crates/phoenix-qgram",
    "crates/phoenix-runtime",
    "crates/phoenix-scanner",
    "crates/phoenix-store-cozo",
    "crates/phoenix-structure",
    "crates/phoenix-types",
    "crates/phoenix-wasm",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["KittClouds"]

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
daachorse = "=0.4.1"
bincode = "1.3"
fst = "0.4"
roaring = "0.10"
thiserror = "1.0"
