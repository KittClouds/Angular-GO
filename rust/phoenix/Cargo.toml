[workspace]
members = [
    "crates/phoenix-native",
    "crates/phoenix-runtime",
    "crates/phoenix-store-cozo",
    "crates/phoenix-types",
    "crates/phoenix-wasm",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["KittClouds"]

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
